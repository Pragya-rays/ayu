services:
  - type: web
    name: ayu
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: VOICE_LAB
        value: "false"
      - key: GNANI_API_KEY
        sync: false
      - key: DASHBOARD_SECRET
        sync: false
      - key: PRISMA_KEYTERMS
        value: ambulance,CPR,petrol pump,Gomti Nagar,chowk,gali,hospital
